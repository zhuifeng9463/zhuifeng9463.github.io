<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>茜茜 · Qianqian</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #fdf6f0 0%, #f7e8e8 55%, #eef2f7 100%);
    color: #3a3a3a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 560px;
    width: 100%;
    text-align: center;
    background: rgba(255,255,255,0.75);
    border-radius: 24px;
    padding: 56px 32px 44px;
    box-shadow: 0 12px 40px rgba(180, 140, 140, 0.18);
  }
  h1 { font-size: 44px; letter-spacing: 8px; color: #8a5a5a; margin-bottom: 8px; }
  .en { letter-spacing: 6px; color: #b08a8a; font-size: 13px; text-transform: uppercase; margin-bottom: 28px; }
  p { line-height: 2; font-size: 16px; color: #5a4a4a; margin-bottom: 14px; }
  .divider { width: 48px; height: 2px; background: #d9a5a5; margin: 28px auto; border-radius: 2px; }
  .tags { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 8px; }
  .tag {
    padding: 7px 16px; border-radius: 999px;
    background: #f7e8e8; color: #8a5a5a; font-size: 14px;
  }
  footer { margin-top: 36px; font-size: 13px; color: #a89898; letter-spacing: 2px; }
</style>
</head>
<body>
  <div class="card">
    <h1>茜茜</h1>
    <div class="en">Qianqian</div>
    <p>你好，我是茜茜。</p>
    <p>正在学唱歌，正在学着成为<br>更真实的自己。</p>
    <div class="divider"></div>
    <div class="tags">
      <span class="tag">唱歌</span>
      <span class="tag">跳舞</span>
      <span class="tag">学习</span>
      <span class="tag">做自己喜欢的事</span>
    </div>
    <footer>qianqian.loc.cc</footer>
  </div>
</body>
</html>
